name: Build macOS

on:
  workflow_dispatch:
  pull_request:

jobs:
  Build_macOS:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Add Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter version
        run: flutter --version

      - name: Get app dependencies
        run: flutter pub get --no-example

      - name: Get rhttp dependencies
        working-directory: plugins/rhttp/rhttp
        run: flutter pub get

      - name: Generate rhttp freezed files
        working-directory: plugins/rhttp/rhttp
        run: dart run build_runner build

      - name: Generate app files
        run: dart run build_runner build

      - name: Build macOS
        env:
          # setup-rust-toolchain defaults to -D warnings; rhttp's cargokit
          # build would otherwise fail on compiler warnings.
          RUSTFLAGS: ""
        run: flutter build macos --release --no-pub

      - name: Package app
        run: |
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/pixez_flutter.app \
            build/macos/Build/Products/Release/pixez-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: pixez-macos.zip
          path: build/macos/Build/Products/Release/pixez-macos.zip
