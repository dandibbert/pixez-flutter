name: Build Android

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - experiment/novel-tts-base
      - feature/novel-tts-plan

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve app dependencies
        run: flutter pub get

      - name: Resolve rhttp dependencies
        working-directory: plugins/rhttp/rhttp
        run: flutter pub get

      - name: Generate rhttp sources
        working-directory: plugins/rhttp/rhttp
        run: dart run build_runner build

      - name: Generate app sources
        run: dart run build_runner build

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pixez-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
